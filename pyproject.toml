[project]
name = "nasdq13"
version = "0.2.0"
description = "NASDAQ small-cap signal bot and FastAPI dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "yfinance==1.5.2",
  "pandas==3.0.3",
  "numpy==2.2.6",
  "matplotlib==3.10.5",
  "aiohttp==3.13.3",
  "httpx==0.28.1",
  "aiogram==3.30.0",
  "python-dotenv==1.2.1",
  "pyyaml==6.0.3",
  "apscheduler==3.11.3",
  "fastapi==0.128.8",
  "starlette==0.52.1",
  "uvicorn==0.48.0",
  "jinja2==3.1.6",
  "aiofiles==25.1.0",
  "loguru==0.7.3",
  "python-json-logger==4.1.0",
  "tenacity==9.1.4",
  "pydantic==2.12.5",
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-mock>=3.12.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "src.vercel_app:app"
