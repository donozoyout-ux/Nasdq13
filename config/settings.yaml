# NASDAQ Signal Bot - Main Settings
# All configurable parameters in one place

app:
  name: "nasdaq-signal-bot"
  version: "1.0.0"
  description: "Real-time NASDAQ breakout signals with technical analysis + news sentiment"
  author: ""
  timezone: "UTC"

# Symbols to track (Yahoo Finance format)
# AL/SAT sinyalleri mid-cap tarayıcıdan ($2B-$10B orta ölçekli şirketler) gelir.
# Ana liste boş bırakılmıştır; isterseniz manuel takip için semboller ekleyin.
symbols:
  []

# Human-readable names for Telegram messages
symbol_names:
  NQ=F: "Nasdaq 100"
  ES=F: "S&P 500"
  YM=F: "Dow Jones"
  RTY=F: "Russell 2000"
  QQQ: "Nasdaq 100 ETF"
  SPY: "S&P 500 ETF"
  DIA: "Dow Jones ETF"
  IWM: "Russell 2000 ETF"
  AAPL: "Apple"
  MSFT: "Microsoft"
  NVDA: "NVIDIA"
  TSLA: "Tesla"
  AMZN: "Amazon"
  GOOGL: "Alphabet (Google)"
  GOOG: "Alphabet (Google)"
  META: "Meta"
  NFLX: "Netflix"
  AMD: "AMD"
  INTC: "Intel"
  JPM: "JPMorgan"

# Timeframes for multi-timeframe analysis
timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "1h"
  - "1d"

# Scan configuration
scanner:
  interval_seconds: 60
  max_concurrent_requests: 5
  request_timeout: 30
  retry_attempts: 3
  retry_delay: 5

# Technical Analysis Parameters
technical:
  # Trend
  ema_short: 9
  ema_medium: 21
  ema_long: 50
  vwap_enabled: true
  
  # Momentum
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  stoch_rsi_period: 14
  
  # Volatility
  bb_period: 20
  bb_std: 2.0
  keltner_period: 20
  keltner_multiplier: 2.0
  atr_period: 14
  
  # Volume
  volume_sma_period: 20
  volume_spike_multiplier: 2.0
  obv_enabled: true
  
  # Breakout
  donchian_period: 20
  gap_threshold_pct: 0.5
  vwap_reclaim_threshold: 0.001

# Signal Scoring Weights (must sum to 100)
signal_weights:
  breakout_strength: 30
  volume_confirmation: 25
  trend_alignment: 20
  momentum: 15
  support_resistance: 10

# Signal Thresholds
thresholds:
  strong_buy: 75
  buy: 60
  watch: 45
  strong_sell: -75
  sell: -60

# News Sentiment Configuration
news:
  enabled: true
  lookback_hours: 6
  max_articles_per_symbol: 20
  keyword_boost_max: 30
  high_impact_multiplier: 3
  
  # Keywords for sentiment scoring
  keywords:
    bearish:
      - "trump tariff"
      - "fed hawkish"
      - "rate hike"
      - "recession"
      - "earnings miss"
      - "guidance cut"
      - "layoffs"
      - "investigation"
      - "lawsuit"
      - "bankruptcy"
      - "downgrade"
      - "sell rating"
    bullish:
      - "fed dovish"
      - "rate cut"
      - "earnings beat"
      - "guidance raise"
      - "buyback"
      - "partnership"
      - "fda approval"
      - "trump pro-business"
      - "upgrade"
      - "buy rating"
      - "strong earnings"
      - "record revenue"
    high_impact:
      - "trump"
      - "powell"
      - "fomc"
      - "cpi"
      - "ppi"
      - "nfp"
      - "unemployment"
      - "interest rate"
      - "inflation"
      - "gdp"
      - "fed meeting"
      - "ecb"
      - "boj"

# Risk Management
risk:
  atr_sl_multiplier: 1.5
  atr_tp1_multiplier: 2.0
  atr_tp2_multiplier: 3.0
  max_signals_per_hour: 10
  signal_cooldown_minutes: 15
  max_daily_signals: 50
  min_risk_reward_ratio: 1.5

# Market Hours
# Saatler New York (America/New_York) saatine göre tanimlidir; DST otomatik yonetilir.
# Turkce goruntuleme Europe/Istanbul (TURKIYE, UTC+3) uzerinden yapilir.
# ABD vadeli piyasasi (NQ/ES/YM/RTY) hafta ici 18:00 - 17:00 (ertesi gun) neredeyse 24 saat aciktir.
# Normal islem seansi: 09:30 - 16:00 New York  =  16:30 - 23:00 Turkiye (yaz saati)
market_hours:
  timezone: "America/New_York"
  display_timezone: "Europe/Istanbul"
  pre_market_start: "04:00"     # NY 04:00 = TR 11:00 (yaz)
  regular_open: "09:30"         # NY 09:30 = TR 16:30 (yaz) / 17:30 (kis)
  regular_close: "16:00"        # NY 16:00 = TR 23:00 (yaz) / 00:00 (kis)
  after_hours_end: "20:00"      # NY 20:00 = TR 03:00 (yaz) / 04:00 (kis)
  trade_only_regular_hours: true
  trade_pre_market: false
  trade_after_hours: false

# Telegram Notifications
telegram:
  enabled: true
  parse_mode: "HTML"
  disable_web_page_preview: true
  message_template: "default"
  include_chart_link: true
  chart_base_url: "https://www.tradingview.com/chart/?symbol="

# State Persistence
state:
  file_path: "data/bot_state.json"
  backup_interval_minutes: 60
  max_signal_history: 1000
  max_scan_history: 200       # persisted mid-cap scan snapshots to keep
  track_performance: true

# Logging
logging:
  level: "INFO"
  format: "json"
  file_path: "logs/bot.log"
  rotation: "1 day"
  retention: "7 days"
  console_output: true

# API Rate Limits (per provider)
rate_limits:
  yfinance:
    requests_per_minute: 100
    requests_per_day: 10000
  newsapi:
    requests_per_day: 100
  alphavantage:
    requests_per_day: 25
    requests_per_minute: 5
  finnhub:
    requests_per_minute: 60

# ============================================================
# HAFTALIK / GÜNLÜK TARAYICI (çıkış adayları)
# Piyasayı kendisi tarar, "ani çıkış yapabilecek" hisseleri otomatik bulur
# ============================================================
screener:
  # Taranacak hisse evreni (sistem buradan aday seçer)
  universe:
    # Teknoloji / Yarı İletken
    - AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, AMD, INTC, MU, AVGO, QCOM
    - ADBE, CRM, ORCL, PLTR, CRWD, SHOP, UBER, PYPL
    # Finans / Fintech
    - JPM, GS, BAC, V, MA, COIN, HOOD
    # Enerji
    - XOM, CVX, OXY, SLB, COP
    # Sağlık / Biyoteknoloji
    - PFE, MRNA, LLY, AMGN, UNH, JNJ
    # Tüketici
    - NKE, MCD, HD, COST, WMT
    # Sanayi / Savunma
    - BA, CAT, GE, LMT
    # Yüksek beta / Büyüme
    - RIVN, NIO, ABNB
  index_symbol: "^GSPC"        # Rölatif güç karşılaştırması için S&P 500
  max_concurrent_requests: 6
  request_timeout: 60
  top_n: 12                    # Raporda gösterilecek aday sayısı
  min_setup_score: 50          # Bu skorun altındakiler elenir
  min_price: 3.0               # Penny stock'ları ele
  lookback_weeks: 60

# ============================================================
# MID-CAP TARAYICI (otomatik orta ölçekli şirket keşfi + çıkış öncesi setup + breakout alarmı)
# Nasdaq ücretsiz screener API kullanır (API key GEREKMEZ).
# Universe her refresh_hours'ta bir yenilenir; setup+trigger taraması scan_interval_minutes'ta bir çalışır.
# ============================================================
smallcap:
  enabled: true

  # --- Universe keşfi (Nasdaq screener) ---
  universe:
    exchanges: ["NASDAQ", "NYSE", "AMEX"]
    min_market_cap: 2000000000       # $2B (micro/small-cap'leri ele, ortanın alt sınırı)
    max_market_cap: 10000000000      # $10B (mid-cap üst sınırı; mega-cap'leri elemek için)
    min_price: 3.0                  # $3 altı penny stock'ları ele
    max_candidates: 250             # tarama evreni üst sınırı (API/yfinance limiti)
    refresh_hours: 12               # universe listesi bu sürede bir yenilenir
    cache_file: "data/midcap_universe.json"
    page_size: 500
    request_timeout: 30

  index_symbol: "^GSPC"             # Göreli güç (RS) karşılaştırması için

  # --- Tarama ayarları ---
  scan_interval_minutes: 15         # seans içinde her 15 dk'da bir setup + trigger taraması
  closed_market_scan_interval_minutes: 60  # piyasa kapalıyken analiz + yarın tahmini her 60 dk tazelenir
  watchlist_size: 25                # intraday (15m) trigger taramasına giren ilk N aday
  min_setup_score: 55               # setup puanı bu eşiğin altındakiler elenir
  min_trigger_score: 60             # breakout alarmı için minimum tetikleyici puanı
  top_n_report: 10                  # Telegram setup raporunda gösterilecek aday sayısı
  lookback_days: 260

  # --- ALIM TALİMATI (ATR tabanlı) ---
  # Mesajlarda net "limit / hedef / zarar kes" göstermek için ATR çarpanları:
  limit_from_price: false           # true: limit = anlık fiyat; false: limit = kırılım seviyesi (donchian)
  sl_atr_multiplier: 1.0            # Zarar kes = limit - ATR x bu çarpan
  tp_atr_multiplier: 2.0            # Hedef     = limit + ATR x bu çarpan

  # --- Davranış ---
  trade_hours_only: true            # true: breakout alarmı sadece piyasa açıkken
                                    # false: 7/24 çalışır (veri yine seans bazlıdır)
                                    # Piyasa kapalıyken analiz her zaman devam eder ve
                                    # "YARIN İÇİN ÇIKIŞ TAHMİNLERİ" raporu günde 1 kez gönderilir.
  max_concurrent_requests: 6
  request_timeout: 60

# ============================================================
# AI RAPOR KATMANI (ücretsiz kurallı AI + opsiyonel LLM)
# ============================================================
ai_report:
  enabled: true
  language: "tr"
  # Opsiyonel: OPENAI_API_KEY tanımlıysa gerçek LLM kullanılır,
  # tanımlı değilse sistem ücretsiz kurallı AI ile rapor üretir.
  llm_model: "gpt-4o-mini"
  llm_max_tokens: 900
  llm_temperature: 0.4
  include_disclaimer: true

# ============================================================
# RAPOR ZAMANLAMASI (Türkiye saati)
# ============================================================
schedule:
  weekly_report:
    day_of_week: 6            # 0=Pzt .. 6=Pazar
    hour_tr: 20
    minute_tr: 0
    run_if_closed_on_startup: true   # Piyasa kapalıyken bot açılırsa raporu hemen üret
  daily_brief:
    enabled: true
    days: [0, 1, 2, 3, 4]     # Pzt-Cuma
    hour_tr: 15
    minute_tr: 30

# Render / Deployment
deployment:
  health_check_port: 8080
  health_check_path: "/health"
  worker_type: "background"
  auto_sleep_prevention: true
  uptime_ping_interval_seconds: 600